<div id="loginView" class="login-container animate-fade">
  <div class="glass-card">
    <img src="https://lh3.googleusercontent.com/d/1-KpB5D-HsWmN2gPY0Io4WlfS2PMe85bC" class="login-logo" alt="Logo">
    <h2 style="margin-bottom: 10px;">E-Arsip Desa Japanan</h2>
    <p style="margin-bottom: 30px; opacity: 0.8;">Silakan masuk ke sistem</p>
    <div id="loginError" style="color: #ff6b6b; margin-bottom: 15px; font-size: 0.9rem;" class="hidden">Username atau Password salah!</div>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="btn-primary" onclick="handleLogin()">Login</button>
    
    <div style="margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0.5;">
      <div style="height: 1px; background: white; flex: 1;"></div>
      <span style="font-size: 0.8rem;">ATAU</span>
      <div style="height: 1px; background: white; flex: 1;"></div>
    </div>
    
    <button class="btn-admin-quick" onclick="quickLogin()">Masuk sebagai Admin (Demo)</button>
  </div>
</div>
