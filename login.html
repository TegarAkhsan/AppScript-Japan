<div id="loginView" class="login-container animate-fade">
  <div class="glass-card">
    <img src="https://lh3.googleusercontent.com/d/1HS7cpUkxgKFNh5rh0a4pyi-SSU7UpXlS" class="login-logo" alt="Logo">
    <h2 style="margin-bottom: 5px; font-size: 2.4rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px;">SIPADJA</h2>
    <p style="margin-bottom: 25px; color: var(--gray-700); font-size: 0.95rem; font-weight: 400; line-height: 1.4;">Sistem Informasi Pengarsipan Desa Japanan</p>
    <div id="loginError" style="color: #ff6b6b; margin-bottom: 15px; font-size: 0.9rem;" class="hidden">Username atau Password salah!</div>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="btn-primary" onclick="handleLogin(this)">Login</button>
    
    <div style="margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0.5;">
      <div style="height: 1px; background: white; flex: 1;"></div>
      <span style="font-size: 0.8rem;">ATAU</span>
      <div style="height: 1px; background: white; flex: 1;"></div>
    </div>
    
    <button class="btn-admin-quick" onclick="quickLogin(this)">Masuk sebagai Admin (Demo)</button>
  </div>
</div>
