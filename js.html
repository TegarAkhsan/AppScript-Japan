<script>
  let currentUser = null;
  let allArchives = [];
  let sessionTimer;
  const INACTIVITY_LIMIT = 30 * 60 * 1000; // 30 Minutes
  let isFetching = false;
  let pollingInterval;

  function setButtonLoading(buttonEl, isLoading, loadingText = "Loading...") {
    if (!buttonEl) return;
    if (isLoading) {
      buttonEl.disabled = true;
      buttonEl.dataset.originalHtml = buttonEl.innerHTML;
      buttonEl.innerHTML = `<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> ${loadingText}`;
      buttonEl.style.opacity = '0.7';
      buttonEl.style.pointerEvents = 'none';
    } else {
      buttonEl.disabled = false;
      buttonEl.innerHTML = buttonEl.dataset.originalHtml || buttonEl.innerHTML;
      buttonEl.style.opacity = '1';
      buttonEl.style.pointerEvents = 'auto';
    }
  }

  function startRealtimeUpdates() {
    stopRealtimeUpdates();
    pollingInterval = setInterval(() => {
      if (currentUser && !isFetching) {
        fetchRealtimeData();
      }
    }, 15000); 
  }

  function stopRealtimeUpdates() {
    if (pollingInterval) clearInterval(pollingInterval);
  }

  function fetchRealtimeData() {
    isFetching = true;
    google.script.run
      .withSuccessHandler(jsonString => {
        isFetching = false;
        try {
          const data = JSON.parse(jsonString);
          const isEditing = !document.getElementById('editModal').classList.contains('hidden');
          if (!isEditing) {
            allArchives = data;
            renderTable(data);
            renderRetentionList(data);
            updateDashboardStats(data);
          }
        } catch (e) {
          console.error("Gagal parse realtime data: " + e.message);
        }
      })
      .withFailureHandler(err => {
        isFetching = false;
        console.error("Gagal realtime update: " + err);
      })
      .getArchives();
  }

  function checkSavedSession() {
    const savedUser = localStorage.getItem('sipadja_user');
    const lastActive = localStorage.getItem('sipadja_session_time');
    
    if (savedUser && lastActive) {
      const now = new Date().getTime();
      const elapsed = now - parseInt(lastActive);
      
      if (elapsed < INACTIVITY_LIMIT) {
        currentUser = savedUser;
        localStorage.setItem('sipadja_session_time', now.toString());
        showView('dashboard');
        startRealtimeUpdates();
        return true;
      }
    }
    logout();
    return false;
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('appSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar && sidebar.classList.contains('open')) {
      closeSidebar();
    } else {
      openSidebar();
    }
  }

  function openSidebar() {
    const sidebar = document.getElementById('appSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar && overlay) {
      sidebar.classList.add('open');
      overlay.classList.add('active');
    }
  }

  function closeSidebar() {
    const sidebar = document.getElementById('appSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar && overlay) {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }
  }

  function showView(viewId) {
    const sections = ['landingView', 'loginSection', 'adminLayout'];
    sections.forEach(s => document.getElementById(s).classList.add('hidden'));

    const adminViews = ['uploadView', 'dataView', 'retentionView', 'dashboardView', 'kategoriView', 'petugasView'];
    adminViews.forEach(v => {
      const el = document.getElementById(v);
      if (el) el.classList.add('hidden');
    });

    // Auto-close sidebar on view change (for mobile)
    closeSidebar();

    if (viewId === 'login') {
      document.getElementById('loginSection').classList.remove('hidden');
      stopSessionTimer();
    } else if (['data', 'upload', 'retention', 'dashboard', 'kategori', 'petugas'].includes(viewId)) {
      document.getElementById('adminLayout').classList.remove('hidden');
      
      const viewEl = document.getElementById(viewId + 'View');
      if (viewEl) viewEl.classList.remove('hidden');
      
      document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));
      
      const activeMenu = document.getElementById('menu-' + viewId);
      if (activeMenu) {
        activeMenu.classList.add('active');
        
        // If it's a subitem, ensure the parent dropdown is open
        if (activeMenu.classList.contains('sidebar-subitem')) {
          const parentDropdownContainer = activeMenu.closest('.dropdown-container');
          if (parentDropdownContainer) {
            parentDropdownContainer.classList.remove('hidden');
            const parentToggle = parentDropdownContainer.previousElementSibling;
            if (parentToggle && parentToggle.classList.contains('dropdown-toggle')) {
              parentToggle.classList.add('active-dropdown');
            }
          }
        }
      }

      // Update breadcrumb text in top navbar
      updateBreadcrumb(viewId);

      if (['data', 'retention', 'dashboard'].includes(viewId)) loadArchives();
      
      startSessionTimer(); // Start/Reset timer when in admin area
    } else {
      document.getElementById('landingView').classList.remove('hidden');
      stopSessionTimer();
    }
  }

  // --- Breadcrumb Update Logic ---
  function updateBreadcrumb(viewId) {
    const breadcrumbText = document.querySelector('.navbar-breadcrumb span');
    if (!breadcrumbText) return;
    
    let label = 'Beranda';
    if (viewId === 'dashboard') label = 'Dashboard';
    else if (viewId === 'kategori') label = 'Kategori Surat';
    else if (viewId === 'petugas') label = 'Data Petugas';
    else if (viewId === 'data') label = 'Data Arsip';
    else if (viewId === 'upload') label = 'Upload Arsip';
    else if (viewId === 'retention') label = 'Retensi Arsip';
    
    breadcrumbText.innerText = label;
  }

  // --- Sidebar Dropdown Animation Toggles ---
  function toggleDropdown(menuId) {
    const container = document.getElementById(menuId);
    if (!container) return;
    
    const isHidden = container.classList.contains('hidden');
    const toggleBtn = container.previousElementSibling;
    
    if (isHidden) {
      container.classList.remove('hidden');
      if (toggleBtn) toggleBtn.classList.add('active-dropdown');
    } else {
      container.classList.add('hidden');
      if (toggleBtn) toggleBtn.classList.remove('active-dropdown');
    }
  }

  // --- Header Profile Menu Toggle ---
  function toggleProfileMenu(event) {
    if (event) event.stopPropagation();
    const menu = document.getElementById('profileDropdownMenu');
    if (menu) {
      menu.classList.toggle('hidden');
    }
  }

  // Close profile dropdown when clicking outside
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('profileDropdownMenu');
    const trigger = document.querySelector('.profile-dropdown-trigger');
    if (menu && !menu.classList.contains('hidden')) {
      if (!menu.contains(e.target) && (!trigger || !trigger.contains(e.target))) {
        menu.classList.add('hidden');
      }
    }
  });

  // --- Dashboard Dynamic Statistics Calculator ---
  function updateDashboardStats(data) {
    if (!data || !Array.isArray(data)) return;
    
    // Count archives by status (case-insensitive for safety)
    const aktifCount = data.filter(item => (item.status || '').toLowerCase() === 'aktif').length;
    const inaktifCount = data.filter(item => (item.status || '').toLowerCase() === 'inaktif').length;
    const statisCount = data.filter(item => {
      const s = (item.status || '').toLowerCase();
      return s === 'statis' || s === 'arsip statis';
    }).length;
    
    // Update DOM elements if present
    const elAktif = document.getElementById('dashboardStatAktif');
    const elInaktif = document.getElementById('dashboardStatInaktif');
    const elStatis = document.getElementById('dashboardStatStatis');
    
    if (elAktif) elAktif.innerText = aktifCount;
    if (elInaktif) elInaktif.innerText = inaktifCount;
    if (elStatis) elStatis.innerText = statisCount;
  }

  // --- Modal Logic ---
  function showAlert(title, message, type = 'success') {
    const modal = document.getElementById('customModal');
    const icon = document.getElementById('modalIcon');
    const titleEl = document.getElementById('modalTitle');
    const msgEl = document.getElementById('modalMessage');

    titleEl.innerText = title;
    msgEl.innerText = message;

    if (type === 'success') {
      icon.innerText = '✅';
      titleEl.style.color = '#10b981';
    } else if (type === 'error') {
      icon.innerText = '❌';
      titleEl.style.color = '#ef4444';
    } else if (type === 'warning') {
      icon.innerText = '⚠️';
      titleEl.style.color = '#f59e0b';
    }

    modal.classList.remove('hidden');
    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('customModal').classList.add('hidden');
    document.getElementById('customModal').style.display = 'none';
  }

  // --- Session Logic ---
  function startSessionTimer() {
    stopSessionTimer();
    sessionTimer = setTimeout(() => {
      logout();
      showAlert('Sesi Berakhir', 'Anda telah inaktif selama lebih dari 30 menit. Silakan login kembali.', 'warning');
    }, INACTIVITY_LIMIT);
  }

  function stopSessionTimer() {
    if (sessionTimer) clearTimeout(sessionTimer);
  }

  function resetSessionTimer() {
    if (currentUser) {
      localStorage.setItem('sipadja_session_time', new Date().getTime().toString());
      startSessionTimer();
    }
  }

  // Listeners for inactivity
  ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, resetSessionTimer, true);
  });

  function quickLogin(buttonEl) {
    document.getElementById('username').value = 'admin';
    document.getElementById('password').value = 'desa123';
    handleLogin(buttonEl);
  }

  function handleLogin(buttonEl) {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    
    if (!user || !pass) {
      showAlert('Input Kosong', 'Silakan isi username dan password!', 'warning');
      return;
    }

    setButtonLoading(buttonEl, true, "Logging in...");
    toggleLoader(true);
    google.script.run
      .withSuccessHandler(res => {
        setButtonLoading(buttonEl, false);
        toggleLoader(false);
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('sipadja_user', res.user);
          localStorage.setItem('sipadja_session_time', new Date().getTime().toString());
          showView('dashboard');
          startRealtimeUpdates();
          showAlert('Berhasil', 'Selamat datang kembali, ' + user + '!', 'success');
        } else {
          document.getElementById('loginError').classList.remove('hidden');
        }
      })
      .withFailureHandler(err => {
        setButtonLoading(buttonEl, false);
        toggleLoader(false);
        showAlert('Error Login', 'Terjadi kesalahan saat mencoba login: ' + err, 'error');
      })
      .checkLogin(user, pass);
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem('sipadja_user');
    localStorage.removeItem('sipadja_session_time');
    stopSessionTimer();
    stopRealtimeUpdates();
    showView('landing');
  }

  function submitArchive(buttonEl) {
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileUpload');
    const cameraInput = document.getElementById('cameraInput');
    const file = fileInput.files[0] || cameraInput.files[0];

    if (file && file.size > 20 * 1024 * 1024) {
      showAlert('File Terlalu Besar', 'Maksimal ukuran file adalah 20MB. File Anda: ' + (file.size / (1024 * 1024)).toFixed(2) + 'MB', 'warning');
      return;
    }

    const formData = {
      nomorSurat: form.nomorSurat.value,
      judulArsip: form.judulArsip.value,
      jenisSurat: form.jenisSurat.value,
      kategoriArsip: form.kategoriArsip.value,
      tanggalArsip: form.tanggalArsip.value,
      statusArsip: form.statusArsip.value,
      masaRetensi: form.masaRetensi.value,
      keterangan: form.keterangan.value,
      fileName: file ? file.name : null,
      fileData: null
    };

    if (!formData.nomorSurat || !formData.judulArsip) {
      showAlert('Lengkapi Form', 'Mohon isi Nomor Surat dan Judul!', 'warning');
      return;
    }

    setButtonLoading(buttonEl, true, "Menyimpan...");
    toggleLoader(true);

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        formData.fileData = e.target.result;
        sendToServer(formData, buttonEl);
      };
      reader.readAsDataURL(file);
    } else {
      sendToServer(formData, buttonEl);
    }
  }

  function sendToServer(formData, buttonEl) {
    google.script.run
      .withSuccessHandler(res => {
        setButtonLoading(buttonEl, false);
        toggleLoader(false);
        showAlert('Berhasil', 'Data arsip dan dokumen berhasil disimpan!', 'success');
        document.getElementById('uploadForm').reset();
        document.getElementById('fileName').style.display = 'none';
        showView('dashboard');
      })
      .withFailureHandler(err => {
        setButtonLoading(buttonEl, false);
        toggleLoader(false);
        showAlert('Gagal Simpan', 'Gagal menyimpan data: ' + err, 'error');
      })
      .saveArchive(formData);
  }

  function loadArchives() {
    toggleLoader(true);
    google.script.run
      .withSuccessHandler(jsonString => {
        toggleLoader(false);
        try {
          const data = JSON.parse(jsonString);
          console.log('Data received:', data);
          if (!data || !Array.isArray(data)) {
            showAlert('Error Data', 'Format data tidak valid.', 'error');
            return;
          }
          allArchives = data;
          renderTable(data);
          renderRetentionList(data);
          updateDashboardStats(data);
        } catch (e) {
          showAlert('Error Parse', 'Gagal memproses data: ' + e.message, 'error');
        }
      })
      .withFailureHandler(err => {
        toggleLoader(false);
        showAlert('Gagal Memuat', 'Gagal mengambil data arsip: ' + err, 'error');
      })
      .getArchives();
  }

  function renderRetentionList(data) {
    const container = document.getElementById('retentionList');
    if (!container) return;
    container.innerHTML = '';
    
    let stats = { total: data.length, aktif: 0, inaktif: 0, warning: 0, danger: 0 };
    const today = new Date();

    data.forEach(item => {
      // Validasi Tanggal
      let startDate = new Date(item.tanggal);
      if (isNaN(startDate.getTime())) {
        startDate = new Date(); // Fallback
      }
      
      const retentionYears = parseInt(item.masaretensi) || 5;
      const expireDate = new Date(startDate);
      expireDate.setFullYear(expireDate.getFullYear() + retentionYears);
      
      const diffTime = expireDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      const totalDuration = retentionYears * 365 * 24 * 60 * 60 * 1000;
      const timePassed = today - new Date(item.tanggal);
      const progressPercent = Math.min(100, Math.max(0, (timePassed / totalDuration) * 100));

      let statusClass = 'status-aman';
      let statusLabel = 'Aman';
      let progressClass = 'progress-safe';
      
      if (diffDays <= 0) {
        statusClass = 'status-danger';
        statusLabel = 'Kadaluwarsa';
        progressClass = 'progress-danger';
        stats.danger++;
      } else if (diffDays <= 90) {
        statusClass = 'status-warning';
        statusLabel = 'Akan Berakhir';
        progressClass = 'progress-warning';
        stats.warning++;
      }
      
      if (item.status === 'Aktif') stats.aktif++;
      else stats.inaktif++;

      const itemHtml = `
        <div class="retention-item animate-fade">
          <div class="retention-header">
            <div>
              <h4 style="font-size: 1.1rem; color: var(--gray-800);">${item.judul} <span class="badge ${item.status === 'Aktif' ? 'badge-aktif' : 'badge-inaktif'}">${item.status}</span></h4>
              <p class="retention-meta" style="color: var(--gray-700);">${item.nomorsurat} • ${item.kategori} • ${new Date(item.tanggal).toLocaleDateString()}</p>
            </div>
            <div style="display: flex; gap: 8px; align-items: center; white-space: nowrap;">
              <button class="action-btn btn-view" title="Lihat" onclick="${item.filelink ? `window.open('${item.filelink}', '_blank')` : `showAlert('Tidak ada File', 'Dokumen arsip ini tidak memiliki file lampiran.', 'warning')`}"><i class="fas fa-eye"></i></button>
              <button class="action-btn btn-edit" title="Edit" onclick="prepareEdit(${item.rowNumber})"><i class="fas fa-edit"></i></button>
              <button class="action-btn btn-delete" title="Hapus" onclick="confirmDelete(${item.rowNumber})"><i class="fas fa-trash-alt"></i></button>
              ${item.status !== 'Arsip Statis' ? 
                `<button class="action-btn btn-move" title="Pindahkan Status" onclick="moveArchiveStatus(${item.rowNumber})"><i class="fas fa-exchange-alt"></i></button>` : 
                `<button class="action-btn" title="Status Statis Maksimal" style="color: #ccc; cursor: not-allowed;" disabled><i class="fas fa-exchange-alt"></i></button>`
              }
            </div>
          </div>
          <div class="retention-details" style="color: var(--gray-700);">
            <div>Masa Retensi: <strong>${retentionYears} Tahun</strong></div>
            <div>Status Retensi: <strong class="${statusClass}">${statusLabel}</strong></div>
            <div>Sisa Waktu: <strong>${diffDays > 0 ? diffDays + ' hari' : Math.abs(diffDays) + ' hari yang lalu'}</strong></div>
          </div>
          <div class="progress-container">
            <div class="progress-bar ${progressClass}" style="width: ${progressPercent}%"></div>
          </div>
        </div>
      `;
      container.innerHTML += itemHtml;
    });

    document.getElementById('statTotal').innerText = stats.total;
    document.getElementById('statAktif').innerText = stats.aktif;
    document.getElementById('statInaktif').innerText = stats.inaktif;
    document.getElementById('statWarning').innerText = stats.warning;
    document.getElementById('statDanger').innerText = stats.danger;

    const alertBox = document.getElementById('retentionAlert');
    if (stats.warning > 0 || stats.danger > 0) {
      alertBox.classList.remove('hidden');
      document.getElementById('alertText').innerText = `Perhatian! Ada ${stats.warning + stats.danger} arsip yang memerlukan tindakan penyusutan.`;
    } else {
      alertBox.classList.add('hidden');
    }
  }

  function renderTable(data) {
    const body = document.getElementById('archiveBody');
    body.innerHTML = '';
    
    data.forEach((item, index) => {
      const row = `<tr>
        <td style="text-align: center; opacity: 0.7;">${index + 1}</td>
        <td><strong>${item.judul}</strong></td>
        <td>${item.nomorsurat}</td>
        <td>${item.jenissurat || '-'}</td>
        <td>${new Date(item.tanggal).toLocaleDateString('en-CA')}</td>
        <td><span class="badge ${item.status === 'Aktif' ? 'badge-aktif' : 'badge-inaktif'}">${item.status}</span></td>
        <td>${item.masaretensi} Tahun</td>
        <td style="text-align: center; white-space: nowrap;">
          <button class="action-btn btn-view" title="Lihat" onclick="${item.filelink ? `window.open('${item.filelink}', '_blank')` : `showAlert('Tidak ada File', 'Dokumen arsip ini tidak memiliki file lampiran.', 'warning')`}"><i class="fas fa-eye"></i></button>
          <button class="action-btn btn-download" title="Download" onclick="${item.filelink ? `window.open('${item.filelink}', '_blank')` : `showAlert('Tidak ada File', 'Dokumen arsip ini tidak memiliki file lampiran.', 'warning')`}"><i class="fas fa-download"></i></button>
          <button class="action-btn btn-edit" title="Edit" onclick="prepareEdit(${item.rowNumber})"><i class="fas fa-edit"></i></button>
          <button class="action-btn btn-delete" title="Hapus" onclick="confirmDelete(${item.rowNumber})"><i class="fas fa-trash-alt"></i></button>
        </td>
      </tr>`;
      body.innerHTML += row;
    });

    document.getElementById('resultCount').innerText = `Menampilkan ${data.length} dari ${allArchives.length} arsip`;
  }

  function confirmDelete(rowNumber) {
    if (confirm('Apakah Anda yakin ingin menghapus arsip ini secara permanen?')) {
      toggleLoader(true);
      google.script.run
        .withSuccessHandler(() => {
          toggleLoader(false);
          showAlert('Dihapus', 'Data arsip berhasil dihapus.', 'success');
          loadArchives();
        })
        .withFailureHandler(err => {
          toggleLoader(false);
          showAlert('Gagal', 'Gagal menghapus data: ' + err, 'error');
        })
        .deleteArchive(rowNumber);
    }
  }

  function moveArchiveStatus(rowNumber) {
    const archive = allArchives.find(a => a.rowNumber === rowNumber);
    if (!archive) return;

    let nextStatus = '';
    if (archive.status === 'Aktif') {
      nextStatus = 'Inaktif';
    } else if (archive.status === 'Inaktif') {
      nextStatus = 'Arsip Statis';
    } else {
      showAlert('Info', 'Arsip sudah berstatus Statis.', 'warning');
      return;
    }

    if (confirm(`Apakah Anda yakin ingin memindahkan status arsip "${archive.judul}" dari "${archive.status}" menjadi "${nextStatus}"?`)) {
      toggleLoader(true);
      const formData = {
        nomorSurat: archive.nomorsurat,
        judulArsip: archive.judul,
        jenisSurat: archive.jenissurat,
        kategoriArsip: archive.kategori,
        tanggalArsip: archive.tanggal,
        statusArsip: nextStatus,
        masaRetensi: archive.masaretensi,
        keterangan: archive.keterangan
      };

      google.script.run
        .withSuccessHandler(() => {
          toggleLoader(false);
          showAlert('Berhasil', `Status arsip berhasil dipindahkan ke "${nextStatus}".`, 'success');
          loadArchives();
        })
        .withFailureHandler(err => {
          toggleLoader(false);
          showAlert('Gagal', 'Gagal memindahkan status: ' + err, 'error');
        })
        .updateArchive(rowNumber, formData);
    }
  }

  function prepareEdit(rowNumber) {
    const archive = allArchives.find(a => a.rowNumber === rowNumber);
    if (!archive) return;

    const form = document.getElementById('editForm');
    form.editRowNumber.value = rowNumber;
    form.nomorSurat.value = archive.nomorsurat;
    form.judulArsip.value = archive.judul;
    form.jenisSurat.value = archive.jenissurat;
    form.kategoriArsip.value = archive.kategori;
    form.tanggalArsip.value = archive.tanggal;
    form.statusArsip.value = archive.status;
    form.masaRetensi.value = archive.masaretensi;
    form.keterangan.value = archive.keterangan;

    document.getElementById('editModal').classList.remove('hidden');
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
    document.getElementById('editModal').style.display = 'none';
  }

  // Hook form submit (we handle this here because the modal is in index.html)
  document.addEventListener('DOMContentLoaded', () => {
    const editForm = document.getElementById('editForm');
    if (editForm) {
      editForm.onsubmit = function(e) {
        e.preventDefault();
        const rowNumber = this.editRowNumber.value;
        const formData = {
          nomorSurat: this.nomorSurat.value,
          judulArsip: this.judulArsip.value,
          jenisSurat: this.jenisSurat.value,
          kategoriArsip: this.kategoriArsip.value,
          tanggalArsip: this.tanggalArsip.value,
          statusArsip: this.statusArsip.value,
          masaRetensi: this.masaRetensi.value,
          keterangan: this.keterangan.value
        };

        toggleLoader(true);
        google.script.run
          .withSuccessHandler(() => {
            toggleLoader(false);
            closeEditModal();
            showAlert('Berhasil', 'Data arsip berhasil diperbarui.', 'success');
            loadArchives();
          })
          .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Gagal Update', 'Gagal memperbarui data: ' + err, 'error');
          })
          .updateArchive(rowNumber, formData);
      };
    }
  });

  function filterTable() {
    const search = document.getElementById('searchArsip').value.toLowerCase();
    const jenis = document.getElementById('filterJenis').value;
    const status = document.getElementById('filterStatus').value;
    
    const filtered = allArchives.filter(item => {
      const matchSearch = item.judul.toLowerCase().includes(search) || item.nomorsurat.toLowerCase().includes(search);
      const matchJenis = jenis === "" || item.jenissurat === jenis;
      const matchStatus = status === "" || item.status === status;
      return matchSearch && matchJenis && matchStatus;
    });
    
    renderTable(filtered);
  }

  function filterRetention() {
    const search = document.getElementById('searchRetention').value.toLowerCase();
    const status = document.getElementById('filterRetentionStatus').value;
    const today = new Date();

    const filtered = allArchives.filter(item => {
      const matchSearch = item.judul.toLowerCase().includes(search) || item.nomorsurat.toLowerCase().includes(search);
      
      // Calculate status for filtering
      let startDate = new Date(item.tanggal);
      if (isNaN(startDate.getTime())) startDate = new Date();
      const retentionYears = parseInt(item.masaretensi) || 5;
      const expireDate = new Date(startDate);
      expireDate.setFullYear(expireDate.getFullYear() + retentionYears);
      const diffTime = expireDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      let currentStatus = "Aman";
      if (diffDays <= 0) currentStatus = "Kadaluwarsa";
      else if (diffDays <= 90) currentStatus = "Akan Berakhir";

      const matchStatus = status === "" || currentStatus === status;
      return matchSearch && matchStatus;
    });

    renderRetentionList(filtered);
  }

  function toggleLoader(show) {
    document.getElementById('loader').classList.toggle('hidden', !show);
  }

  function updateFileName(input, isCamera = false) {
    const fileNameDisplay = document.getElementById('fileName');
    
    // If one input is used, clear the other
    if (isCamera) {
      document.getElementById('fileUpload').value = "";
    } else {
      document.getElementById('cameraInput').value = "";
    }

    if (input.files && input.files[0]) {
      const file = input.files[0];
      const prefix = isCamera ? "📸 " : "📄 ";
      fileNameDisplay.innerHTML = `${prefix} ${file.name} <br> <small>${(file.size / (1024 * 1024)).toFixed(2)} MB</small>`;
      fileNameDisplay.style.display = 'block';
    } else {
      fileNameDisplay.innerText = "";
      fileNameDisplay.style.display = 'none';
    }
  }

  function createDummy(buttonEl) {
    setButtonLoading(buttonEl, true, "Generating...");
    toggleLoader(true);
    google.script.run
      .withSuccessHandler(res => {
        setButtonLoading(buttonEl, false);
        toggleLoader(false);
        showAlert('Dummy Berhasil', res.count + ' data dummy berhasil ditambahkan ke Spreadsheet!', 'success');
        loadArchives();
      })
      .withFailureHandler(err => {
        setButtonLoading(buttonEl, false);
        toggleLoader(false);
        showAlert('Gagal', 'Terjadi kesalahan: ' + err, 'error');
      })
      .generateDummyData();
  }

  // Initialize
  window.onload = () => {
    const sessionActive = checkSavedSession();
    if (!sessionActive) {
      showView('landing');
    }
  };
</script>
